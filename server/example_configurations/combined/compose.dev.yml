name: basyx-python-server
services:
  repository:
    build:
      context: ../..
      additional_contexts:
        - sdk=../../../sdk
        - license=../../..
      dockerfile: ./docker/repository/Dockerfile
    ports:
    - "8080:80"
    volumes:
      - ./repository/input:/input
      - ./repository/storage:/storage
    environment:
      STORAGE_PERSISTENCY: True
  registry:
    build:
      context: ../..
      additional_contexts:
        - sdk=../../../sdk
        - license=../../..
      dockerfile: ./docker/registry/Dockerfile
    ports:
    - "8083:80"
    volumes:
      - ./registry/input:/input
      - ./registry/storage:/storage
    environment:
      STORAGE_PERSISTENCY: True
  discovery:
    build:
      context: ../..
      additional_contexts:
        - sdk=../../../sdk
        - license=../../..
      dockerfile: ./docker/discovery/Dockerfile
    ports:
    - "8084:80"
    environment:
      storage_path: /storage/discovery_store.json
    volumes:
      - ./discovery/storage:/storage
